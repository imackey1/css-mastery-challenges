<!DOCTYPE HTML>
<html>
   <head>
      <meta charset="UTF-8">
      <title>I Heart NY T-Shirt</title>
      <style>

         /* Container div: positioned relative, with a background color.
            inline-block keeps the colored box snug around the shirt. */
         div {
            position: relative;
            display: inline-block;
            background-color: #7fa8d6;
         }

         /* Relative positioning: shirt sits 10px to the right of its default location.
            z-index only works because the image is positioned (relative). */
         img {
            position: relative;
            left: 10px;
            z-index: 1;

            /* Black border */
            border: 10px solid black;

            /* Space between the border and the image */
            padding: 10px;

            /* Space around the image */
            margin: 20px;

            background-color: #eef3fa;
            box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.5);
         }

         .words {
            font-family: impact;
            font-size: 60px;
         }

         .first {
            position: absolute;
            z-index: 10;
            top: 190px;
            left: 205px;
         }

         .heart {
            color: red;
            font-size: 80px;
            position: absolute;
            z-index: 10;
            top: 170px;
            left: 240px;
         }

         .last {
            position: absolute;
            z-index: 10;
            top: 255px;
            left: 205px;
         }

      </style>
   </head>
   <body>
      <span class="first words">I</span>

      <span class="heart">&hearts;</span>

      <span class="last words">NY</span>

      <div>
         <img src="tshirt.png" alt="White t-shirt">
      </div>
   </body>
</html>
